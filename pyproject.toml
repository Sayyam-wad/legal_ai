[project]
name = "legal-ai"
version = "0.2.0"
description = "Hybrid retrieval and grounded answers over Indian Supreme Court case law (AILA 2019)"
requires-python = ">=3.10"
readme = "README.md"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
